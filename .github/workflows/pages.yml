name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # the TD feed is refreshed biweekly; rebuild the routing data weekly
    - cron: "17 20 * * 0"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache raw GTFS feed
        uses: actions/cache@v4
        with:
          path: /tmp/gtfs-cache
          key: gtfs-${{ github.run_id }}
          restore-keys: gtfs-
      - name: Build routing data from TD GTFS
        env:
          KHH_CACHE: /tmp/gtfs-cache
        run: |
          python pipeline/build_data.py
          python pipeline/verify.py 1
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
