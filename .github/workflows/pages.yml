name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Rebuild and redeploy every 30 minutes so an open page always has a recent
    # dataset (the client polls meta.json and swaps data in place).
    # The TD timetable itself is biweekly; what actually changes within a day is
    # the operator API side (names/headsigns) and any feed correction.
    - cron: "*/30 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache raw GTFS feed
        uses: actions/cache@v4
        with:
          path: /tmp/gtfs-cache
          key: gtfs-${{ github.run_id }}
          restore-keys: gtfs-
      - name: Build routing data from TD GTFS
        env:
          KHH_CACHE: /tmp/gtfs-cache
        run: |
          python pipeline/build_data.py
          python pipeline/verify.py 1
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stamp asset version
        # cache-bust css/js per deploy so a stale cached script can never be paired
        # with fresh HTML (that pairing kills the map: the old script looks for
        # controls the new page no longer has)
        run: |
          v="${GITHUB_SHA::8}"
          sed -i "s/__ASSET_V__/${v}/g" index.html
          grep -o 'app\.js?v=[a-z0-9]*' index.html
          grep -o 'style\.css?v=[a-z0-9]*' index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
